[package]
name = "turnforge"
version = "0.1.0"
edition = "2024"
publish = false
description = "A headless agent harness with explicit state and structured execution"
license = "Apache-2.0"
repository = "https://github.com/shunminli/turnforge"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
eventsource-stream = "0.2.3"
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "fs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
